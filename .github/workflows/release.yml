# Shineos Local AI - 自動ビルド＆GitHub Releases 配布
#
# - v* タグを push すると: Windows 上で Inno Setup ビルド → リリースに
#   ShineosLocalAI-Setup-<version>.exe を自動添付
# - workflow_dispatch で: ビルドのみ（アーティファクト確認用）
name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            # 公式GitHubリリースから直接取得（download.php はスタブHTMLを返すため不使用）
            curl.exe -L --fail --retry 3 -o "$env:TEMP\innosetup.exe" https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup download failed" }
            $size = (Get-Item "$env:TEMP\innosetup.exe").Length
            if ($size -lt 5MB) { throw "Inno Setup download looks invalid (${size} bytes)" }
            Start-Process -FilePath "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          Write-Output "ISCC: $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 7\ISCC.exe' installer\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact (manual build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ShineosLocalAI-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
